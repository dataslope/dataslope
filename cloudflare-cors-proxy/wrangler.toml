name = "dataslope-cors-proxy"
main = "src/index.ts"
compatibility_date = "2025-05-19"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated allowed Origins (no trailing slash). Override for production
# via `wrangler secret put ALLOWED_ORIGINS` or the Cloudflare dashboard.
# "*" matches a single hostname label (never "." or "/"). The
# `*-dataslope.subwaymatch.workers.dev` entry covers Cloudflare's
# version/alias preview URLs (variable part is a prefix); safe because the
# subwaymatch.workers.dev subdomain is owner-controlled.
ALLOWED_ORIGINS = "http://localhost:3000,https://dataslope.com,https://www.dataslope.com,https://dataslope.subwaymatch.workers.dev,https://*-dataslope.subwaymatch.workers.dev"

