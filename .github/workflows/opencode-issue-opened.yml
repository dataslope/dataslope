name: opencode-issue

on:
  issues:
    types: [opened]

jobs:
  opencode:
    # Only run if the issue creator is the repo owner
    if: github.event.issue.user.login == github.repository_owner

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write # needed to create PRs
      pull-requests: write # needed to open PRs
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k2.6
          prompt: |
            A new GitHub issue has been opened by the repository owner.

            Your task:
            - Read and understand the description.
            - Determine the intent (bug fix, feature, refactor, styling update, documentation, etc.)
            - Implement the requested changes in the codebase
            - ALWAYS create a pull request, even if the issue is ambiguous or incomplete

            Execution Rules:
            - If the issue is clear: implement exactly what is requested
            - If the issue is vague or incomplete: make a reasonable, minimal interpretation
            - Avoid scope creep

            Pull Request Requirements:
            - Always create a PR
            - Use a clear, descriptive title
            - In the PR description:
              - Summarize the changes made
              - Explain any assumptions or interpretations
              - Reference the original issue

            Never exit without creating a pull request.
