name: opencode-issue

on:
  issues:
    types: [opened]

jobs:
  opencode:
    # Only run if the issue creator is the repo owner
    if: github.event.issue.user.login == github.repository_owner

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write # needed to create PRs
      pull-requests: write # needed to open PRs
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/kimi-k2.6
          prompt: |
            A new GitHub issue has been opened by the repository owner.

            Your task:
            - Read and understand the issue
            - Determine the intent (bug fix, feature, refactor, styling update, documentation, etc.)
            - Make the appropriate changes to the codebase
            - Create a pull request with a clear title and description

            Guidelines:
            - For styling or UI changes (e.g., CSS), apply clean, consistent, and minimal updates
            - For features, implement only what is described—avoid scope creep
            - For refactors, preserve existing behavior unless the issue specifies otherwise
            - Follow the existing code style, structure, and conventions
            - Keep changes focused and minimal

            Pull Request Requirements:
            - Explain what was changed and why
            - Reference the original issue
            - Ensure the code builds and passes existing checks (if applicable)

            If the issue is unclear, incomplete, or cannot be safely implemented, do not create a PR.
