name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select model
        id: model
        shell: bash
        run: |
          if [[ "${{ contains(github.event.issue.labels.*.name, 'complex') }}" == "true" ]]; then
            echo "model=opencode-go/kimi-k2.6" >> "$GITHUB_OUTPUT"
          else
            echo "model=opencode-go/deepseek-v4-flash" >> "$GITHUB_OUTPUT"
          fi

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ steps.model.outputs.model }}
