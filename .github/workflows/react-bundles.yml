name: Precompiled React bundles

# Compiles every `<CodeBlock adapter="react">` into the ES module its preview
# renders (scripts/build-react-bundles.mjs) and commits the result. Doing the
# TSX translation in the reader's browser would cost a ~3 MB esbuild-wasm
# download per visitor; instead deploys and `dev` just read the committed
# manifest, and this workflow only compiles changed blocks (entries are keyed
# by content hash, lib/blockOutputKey.ts, checked against the committed
# manifest — a local cache stamp wouldn't survive `npm ci`). Bare imports are
# rewritten to pinned esm.sh URLs and marked external, so bundles stay tiny.
#
# The version pin is load-bearing: the generator asserts the `esbuild-wasm`
# devDependency matches ESBUILD_WASM_VERSION in app/_components/runtime/cdn.ts
# (what the browser worker loads) and exits non-zero on mismatch — a
# different esbuild is a different bundle. Bump both together or not at all.
#
# A PR's new/edited block shows the empty preview panel until this regenerates
# after merge; pressing Run still bundles in the browser either way.
# Deliberately not run on PRs — that would mean a bot commit on every branch.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.mdx"
      - "scripts/build-react-bundles.mjs"
      - "scripts/lib/ts-resolve.mjs"
      - "scripts/lib/mdx-blocks.mjs"
      - "app/_components/runtime/reactBundle.ts"
      - "app/_components/runtime/esmResolve.ts"
      - "app/_components/runtime/cdn.ts"
      - "lib/blockOutputKey.ts"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-bundle every block, ignoring the committed manifest"
        type: boolean
        default: false

# One at a time: two runs committing to main would race, and the loser's
# regenerated manifest would be reverted by the winner's push.
concurrency:
  group: react-bundles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Pushes made with the default GITHUB_TOKEN don't fire `push`
          # events, so this job's commit can't re-trigger the workflow.
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `--ignore-scripts` skips the postinstall codegen; this job needs the
      # dependencies only.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate
        run: node scripts/build-react-bundles.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated/react-bundles.json
          if git diff --cached --quiet; then
            echo "No React bundle changed."
            exit 0
          fi
          summary=$(git diff --cached --stat | tail -1)
          git commit -m "Regenerate precompiled React bundles" \
                     -m "$summary" \
                     -m "Automated by .github/workflows/react-bundles.yml."
          git push
