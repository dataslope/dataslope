name: Content sweeps

# Runs the sweeps that execute the site's runnable content:
#
#   • check:challenges  — every Python <ChallengeCard>'s reference solution
#                         against that card's own tests.
#   • check:code-blocks — every Python <CodeBlock> a reader can press Run on.
#   • check:js          — every JavaScript and TypeScript <CodeBlock> and
#                         <ChallengeCard>, through the same almostnode runtime
#                         the browser uses.
#   • check:sql         — every <SqlCodeBlock> and <SqlChallengeCard> against
#                         PGlite and sqlite-wasm, graded by the same
#                         evaluateSqlTest a reader's Check Answer runs.
#   • check:r           — every R <CodeBlock> and <ChallengeCard> through webR.
#   • check:browser     — java, csharp, web, react and php, the five languages
#                         whose runtimes exist only in a browser (CheerpJ, the
#                         .NET wasm runtime, the sandboxed preview iframe,
#                         php-wasm), driven through Playwright against a real
#                         dev server.
#
# All existed as npm scripts that nothing invoked, which is the same as not
# having them.
#
# Twenty blocks across SQL and R teach a failure by triggering it ("A UNIQUE
# constraint rejects duplicate email"; a misspelled `prnt()`), and they carry
# `expectError`. The sweeps assert that in both directions, which is the point:
# a block that stops failing has turned its own lesson into a lie, prose
# promising an error above output showing success, and nothing else in the repo
# would notice.
#
# ── Scope, and why a pull request does not get the full sweep ───────────────
#
# A full sweep costs about 6 minutes of wall-clock on a GitHub runner (Python
# code blocks ~4-6m, challenge cards ~2m, JS/TS well under 1m, in parallel).
# Spending even that to prove one edited lesson still works is wasteful, and
# checking two changed lessons instead takes about 45 seconds, most of it
# Pyodide booting. So the scope depends on what changed:
#
#   • A pull request that edits lessons checks *those lessons* (`--filter`
#     takes a comma-separated list).
#   • A pull request that changes the interpreter — the runner, the harness,
#     the extractor, or the lockfile that pins Pyodide — gets the full sweep,
#     because a partial run proves nothing about a change that affects every
#     block. A Pyodide bump is this case, and it is the one that would surface
#     something like `freq="H"` raising under a new pandas.
#   • A pull request that touches neither runs nothing at all.
#
# The `scope` job below decides which, and says so in the run's summary so a
# green tick is never ambiguous about how much it covered.
#
# ── Why there is still a scheduled run ──────────────────────────────────────
#
# Not to re-check content: content only changes through pull requests, and
# those are swept above. It is there for the inputs that are *not* in this
# repo and can therefore change with no commit to notice:
#
#   • `micropip.install(...)` resolves to the latest release from PyPI at run
#     time, unpinned, for plotly, pyodide_http, seaborn and openpyxl. The
#     reader's worker does the same installs (see `loadHeavyPackages` in
#     pyodide-worker.ts), so a breaking release reaches readers directly.
#   • Lesson datasets come from `dataslope/datasets@main`, a different repo.
#   • `sns.load_dataset(...)` fetches from `mwaskom/seaborn-data`, a
#     third-party one.
#
# Everything Pyodide ships (numpy, pandas, scipy, matplotlib) is pinned by
# version and immutable on the CDN, so it cannot drift on its own. That makes
# the schedule's job narrow, and weekly rather than nightly is proportionate
# to it: it bounds how long a bad upstream release can sit unnoticed to about
# a week, at a seventh of the runner time. Raise the frequency if that window
# turns out to be too wide, or drop the trigger entirely and accept that a
# broken upstream release is found by the next pull request.
#
# ── Why `browser` is scoped harder than the rest ────────────────────────────
#
# The other five sweeps are headless and cheap. `browser` boots a Next dev
# server and drives a real Chromium, and its cost is dominated by per-page
# runtime init that no amount of tuning removes: CheerpJ plus an 18 MB
# tools.jar for Java, a ~35 MB assembly set for C#, once per page because
# each Playwright context gets its own empty HTTP cache. A full run is about
# 30 minutes of blocks and 35 of cards, so it is deliberately *not* part of
# the default pull-request path — only the changed lessons are, which is
# seconds.
#
# It still earns a scheduled run, and for a stronger reason than the Python
# one. CheerpJ is loaded from `cjrtnc.leaningtech.com/4.3/loader.js`, a
# mutable path that upstream can republish under the same 4.3 label, and the
# React preview resolves bare imports through esm.sh at run time. Neither is
# in `package-lock.json`, so neither can be caught by a lockfile diff.

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/check-code-blocks.mjs"
      - "scripts/check-challenge-cards.mjs"
      - "scripts/check-js-blocks.mjs"
      - "scripts/check-r-blocks.mjs"
      - "scripts/check-sql-blocks.mjs"
      - "scripts/check-browser-blocks.mjs"
      - "e2e/_adapterFilter.ts"
      - "e2e/_discoverPages.ts"
      - "e2e/code-blocks-run.spec.ts"
      - "e2e/challenge-solutions.spec.ts"
      - "scripts/lib/mdx-blocks.mjs"
      - "scripts/lib/pyodide-runner.mjs"
      - "scripts/lib/sync-http.mjs"
      - "scripts/lib/sql-engines.mjs"
      - "scripts/lib/datasets.mjs"
      - "app/_components/challengeHarness.ts"
      - "app/_components/runtime/almostnode-worker-shared.ts"
      - "app/_components/runtime/tsTranspile.ts"
      - "app/_components/runtime/rPackages.ts"
      - "app/_components/sqlChallengeHarness.ts"
      - "package-lock.json"
      - ".github/workflows/content-sweeps.yml"
  schedule:
    # 05:40 UTC on Sundays. Off the hour because the shared runner pool is
    # busiest exactly on it. Note that GitHub disables scheduled workflows in a
    # repository with no activity for 60 days, so this stops on its own if the
    # repo goes quiet.
    - cron: "40 5 * * 0"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Which sweep to run"
        type: choice
        default: all
        options: [all, challenges, code-blocks, js, sql, r, browser]
      full:
        description: "Sweep all content (ignore the changed-files filter)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same PR, but never cancel a scheduled
  # one: it is the only thing watching for upstream drift.
  group: content-sweeps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Decide scope
    runs-on: ubuntu-latest
    outputs:
      # Comma-separated content paths to check, or empty for a full sweep.
      filter: ${{ steps.decide.outputs.filter }}
      # "false" when a pull request touched only lessons and none of them
      # contain runnable content, so both sweeps can be skipped outright.
      run: ${{ steps.decide.outputs.run }}
      label: ${{ steps.decide.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the base branch.
          fetch-depth: 0

      - name: Work out what to sweep
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' || inputs.full }}
        run: |
          set -euo pipefail

          if [ "$FORCE_FULL" = "true" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "label=full sweep (all content)" >> "$GITHUB_OUTPUT"
            echo "Full sweep: not a pull request, or explicitly requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$changed"

          # Anything that changes the interpreter itself invalidates a partial
          # run: the same block can start failing without its file being
          # touched. Those pull requests get everything.
          if echo "$changed" | grep -qE '^(scripts/(check-(code-blocks|challenge-cards|js-blocks|sql-blocks|r-blocks|browser-blocks)\.mjs|lib/(mdx-blocks|pyodide-runner|sync-http|sql-engines|datasets)\.mjs)|e2e/(_adapterFilter|_discoverPages|code-blocks-run\.spec|challenge-solutions\.spec)\.ts|app/_components/(challengeHarness|sqlChallengeHarness|runtime/almostnode-worker-shared|runtime/tsTranspile|runtime/rPackages)\.ts|\.github/workflows/content-sweeps\.yml)$'; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "label=full sweep (sweep internals changed)" >> "$GITHUB_OUTPUT"
            echo "Full sweep: a change here affects every block, so a partial run would prove nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The lockfile only matters for one package. A Pyodide bump swaps the
          # interpreter under every block at once (a new pandas is exactly how
          # `freq="H"` broke), so it earns the full sweep. Any other dependency
          # moving does not, and treating them alike would spend 25 minutes on
          # every unrelated Dependabot pull request.
          if echo "$changed" | grep -qx 'package-lock\.json'; then
            v() { git show "$1:package-lock.json" | jq -r '.packages["node_modules/pyodide"].version // empty'; }
            before=$(v "$BASE_SHA"); after=$(v "$HEAD_SHA")
            if [ "$before" != "$after" ]; then
              echo "filter=" >> "$GITHUB_OUTPUT"
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "label=full sweep (pyodide $before to $after)" >> "$GITHUB_OUTPUT"
              echo "Full sweep: pyodide moved from \`$before\` to \`$after\`, which changes the interpreter for every block." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "package-lock.json changed but pyodide is still $after; not a reason to sweep." >> "$GITHUB_STEP_SUMMARY"
          fi

          mdx=$(echo "$changed" | grep -E '^content/.*\.mdx$' || true)
          if [ -z "$mdx" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "label=nothing to sweep" >> "$GITHUB_OUTPUT"
            echo "No lesson files changed; both sweeps skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          filter=$(echo "$mdx" | paste -sd, -)
          count=$(echo "$mdx" | wc -l | tr -d ' ')
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "label=$count changed lesson(s)" >> "$GITHUB_OUTPUT"
          {
            echo "Sweeping **$count changed lesson(s)** rather than all content."
            echo ""
            echo '```'
            echo "$mdx"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  challenges:
    name: Challenge cards (${{ needs.scope.outputs.label }})
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","challenges"]'), inputs.sweep))
    runs-on: ubuntu-latest
    # Generous against a cold cache and a slow PyPI, tight enough that a block
    # which hangs past its own 30s budget cannot burn a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The sweeps need `pyodide` and node built-ins. `--ignore-scripts` skips
      # the postinstall codegen, which they do not read.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-

      - name: Run check:challenges
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:challenges -- --json challenges-report.json --filter "$FILTER"
          else
            npm run check:challenges -- --json challenges-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenges-report
          path: challenges-report.json
          if-no-files-found: ignore

  code-blocks:
    name: Code blocks (${{ needs.scope.outputs.label }})
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","code-blocks"]'), inputs.sweep))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-

      - name: Run check:code-blocks
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:code-blocks -- --json code-blocks-report.json --filter "$FILTER"
          else
            npm run check:code-blocks -- --json code-blocks-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-blocks-report
          path: code-blocks-report.json
          if-no-files-found: ignore

  js:
    name: JavaScript & TypeScript (${{ needs.scope.outputs.label }})
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all","js"]'), inputs.sweep))
    runs-on: ubuntu-latest
    # No WASM toolchain to download and no network per block, so this is the
    # cheapest of the three by a wide margin: 619 items in well under a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run check:js
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:js -- --json js-report.json --filter "$FILTER"
          else
            npm run check:js -- --json js-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-report
          path: js-report.json
          if-no-files-found: ignore

  sql:
    name: SQL (${{ needs.scope.outputs.label }})
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all","sql"]'), inputs.sweep))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-
      - name: Run check:sql
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:sql -- --json sql-report.json --filter "$FILTER"
          else
            npm run check:sql -- --json sql-report.json
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-report
          path: sql-report.json
          if-no-files-found: ignore

  r:
    name: R (${{ needs.scope.outputs.label }})
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all","r"]'), inputs.sweep))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-
      - name: Run check:r
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:r -- --json r-report.json --filter "$FILTER"
          else
            npm run check:r -- --json r-report.json
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-report
          path: r-report.json
          if-no-files-found: ignore

  browser:
    name: Browser runtimes (${{ needs.scope.outputs.label }})
    needs: scope
    # The only sweep that opts *out* of the full-sweep pull-request path. A
    # change to a shared extractor gives the other five everything, and rightly
    # so — they cost minutes. Giving this one everything costs over an hour, so
    # a pull request only ever gets the lessons it actually edited. The
    # scheduled run and an explicit dispatch still cover all of it.
    if: >-
      needs.scope.outputs.run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all","browser"]'), inputs.sweep)) &&
      (github.event_name != 'pull_request' || needs.scope.outputs.filter != '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Not `--ignore-scripts`: unlike the headless sweeps this one serves the
      # actual site, so the postinstall codegen has to run.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts the dev server with a bare `next dev`,
      # which skips the generators `npm run dev` chains ahead of it. Without
      # these the routes 404 and every page reports "no code block".
      #
      # The list is derived from the `dev` script rather than copied, because a
      # copy goes stale silently: `build-search-index.mjs` was deleted on main
      # while this branch was open, and a hard-coded list would have failed the
      # job on a missing file for reasons unrelated to any sweep.
      - name: Generate content sources
        run: |
          node -e "process.stdout.write(require('./package.json').scripts.dev
            .split('&&').map(s => s.trim())
            .filter(s => !s.startsWith('next '))
            .join(' && '))" > .sweep-generators.sh
          cat .sweep-generators.sh; echo
          # npm puts node_modules/.bin on PATH for `npm run`; a bare `sh` does
          # not, and `fumadocs-mdx` is only there.
          PATH="$PWD/node_modules/.bin:$PATH" sh .sweep-generators.sh

      - name: Run check:browser
        env:
          FILTER: ${{ needs.scope.outputs.filter }}
        # One worker on purpose. Measured at three: React cards lost clicks
        # ("after three clicks the heading should read 'Likes: 3'. Got: Likes:
        # 2") and web cards measured zero-height elements, none of which
        # reproduced serially. A sweep that reports contention as broken
        # content is worse than a slower one.
        run: |
          if [ -n "$FILTER" ]; then
            npm run check:browser -- --json browser-report.json --filter "$FILTER" -- --workers=1
          else
            npm run check:browser -- --json browser-report.json -- --workers=1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: browser-report.json
          if-no-files-found: ignore
