name: Prepopulated block output

# Regenerates the prepopulated `<CodeBlock>` output
# (scripts/build-block-outputs.mjs) and commits it, using the same runtimes
# the browser would (Pyodide, almostnode, browsercc) so the panel and a
# pressed Run agree.
#
# Committed rather than built on deploy: executing all ~2,600 blocks takes
# ~an hour. Manifest keys are content hashes, so the generator reuses
# committed entries — deploys execute nothing, this workflow only executes
# changed blocks, and unchanged figure files are never rewritten (matplotlib
# PNG bytes aren't reproducible, so a full re-run would churn all ~370 files).
#
# r, java, csharp, web, react and php have no Node runtime: their entries come
# from `npm run capture:block-outputs` (real browser, run by hand). This job
# carries those entries forward untouched but cannot create them — a new or
# edited block in those languages shows an empty panel until someone runs the
# capture. Missing entries are "no entry", not an error; Run is unaffected.
#
# This is the only thing that runs the generator automatically; `build` and
# `dev` just read the committed manifest. Deliberately not run on PRs — that
# would mean a bot commit on every content branch.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.mdx"
      - "scripts/build-block-outputs.mjs"
      - "scripts/lib/python-output-capture.mjs"
      - "scripts/lib/pyodide-runner.mjs"
      - "scripts/lib/block-runners.mjs"
      - "scripts/lib/mdx-blocks.mjs"
      - "lib/blockOutputKey.ts"
      - "app/_components/runtime/pythonDisplayOutputs.ts"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-execute every block, ignoring the committed manifest"
        type: boolean
        default: false

# One at a time: two runs committing to main would race each other, and the
# loser's regenerated assets would be reverted by the winner's push.
concurrency:
  group: block-outputs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A normal run only executes the blocks that changed and finishes in
    # minutes. This is sized for `workflow_dispatch` with `force`, which
    # re-executes all four runtimes: ~12 min of Pyodide, ~25 of clang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Pushes made with the default GITHUB_TOKEN don't fire `push`
          # events, so this job's commit can't re-trigger the workflow.
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `--ignore-scripts` skips the postinstall codegen; this job needs the
      # dependencies only.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Not optional: it rewrites an asset URL inside node_modules, and
      # package.json runs it outside the gated half of postinstall.
      - name: Patch almostnode
        run: node scripts/patch-almostnode.mjs

      # CSV-reading blocks fetch from the dataslope/datasets repo; cache so
      # regenerations don't re-download the same files.
      - name: Restore dataset cache
        uses: actions/cache@v6
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-

      # 114 MB toolchain, downloaded from npm on first use. Keyed on the
      # pinned versions in block-runners.mjs so a bump fetches fresh.
      - name: Restore C/C++ toolchain
        uses: actions/cache@v6
        with:
          path: .browsercc-cache
          key: browsercc-cache-v1-${{ hashFiles('scripts/lib/block-runners.mjs') }}
          restore-keys: browsercc-cache-v1-

      - name: Regenerate
        run: node scripts/build-block-outputs.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated/block-outputs.json public/block-outputs
          if git diff --cached --quiet; then
            echo "No block output changed."
            exit 0
          fi
          # Include what moved so the bot commit says which lessons changed.
          summary=$(git diff --cached --stat | tail -1)
          git commit -m "Regenerate prepopulated block output" \
                     -m "$summary" \
                     -m "Automated by .github/workflows/block-outputs.yml."
          git push
