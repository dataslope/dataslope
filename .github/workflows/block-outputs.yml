name: Prepopulated block output

# Regenerates the output a `<CodeBlock>` shows before the reader presses Run
# (`scripts/build-block-outputs.mjs`), and commits the result. Python runs
# through Pyodide, JavaScript and TypeScript through almostnode, C and C++
# through the browsercc toolchain — in every case the same runtime the browser
# would have used, so a prepopulated panel and a pressed Run agree.
#
# ── Why this is a workflow and not part of the deploy ──────────────────────
#
# Executing 2,600 blocks costs the better part of an hour, most of it Pyodide.
# Paying that on every Cloudflare deploy took a 20-minute build and returned
# the same answer each time, because the answer only changes when a lesson
# changes.
#
# So the manifest and its figures are committed, and this workflow is what
# keeps them current. The generator reuses committed entries key-for-key —
# keys are content hashes, so an entry that exists is an entry that is still
# correct — which means:
#
#   • a deploy reads the committed manifest and executes nothing;
#   • this workflow only executes the blocks that actually changed;
#   • an unchanged block's figure file is never rewritten, so the committed
#     assets do not churn. That matters: matplotlib's PNG bytes are not
#     reproducible run to run, so a full re-run would rewrite all ~370 files
#     every time for no visible change.
#
# This workflow is the *only* thing that runs the generator automatically.
# Neither `build` nor `dev` does: both read the committed manifest and nothing
# else, so no deploy and no local start ever boots Pyodide or clang. Anyone
# who wants a block's output sooner runs `npm run build:block-outputs`.
#
# ── What a pull request sees ──────────────────────────────────────────────
#
# A block that already existed: its committed output, same as production. A
# block the PR *adds or edits*: an empty output panel, until this workflow
# regenerates after the merge. That is the same panel the block would show if
# its entry were missing for any other reason, and the same one every block
# showed before this feature existed — prepopulated output is a nicety, and
# every consumer treats a missing entry as "no entry" rather than an error.
# Pressing Run is unaffected either way.
#
# This workflow deliberately does not run on pull requests: it would mean a
# bot commit on every content branch.

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.mdx"
      - "scripts/build-block-outputs.mjs"
      - "scripts/lib/python-output-capture.mjs"
      - "scripts/lib/pyodide-runner.mjs"
      - "scripts/lib/block-runners.mjs"
      - "lib/blockOutputKey.ts"
      - "app/_components/runtime/pythonDisplayOutputs.ts"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-execute every block, ignoring the committed manifest"
        type: boolean
        default: false

# One at a time: two runs committing to main would race each other, and the
# loser's regenerated assets would be reverted by the winner's push.
concurrency:
  group: block-outputs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A normal run only executes the blocks that changed and finishes in
    # minutes. This is sized for `workflow_dispatch` with `force`, which
    # re-executes all four runtimes: ~12 min of Pyodide, ~25 of clang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit this job pushes must not re-trigger the workflow; a
          # push made with the default GITHUB_TOKEN does not fire `push`
          # events, which is exactly the behaviour wanted here.
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `--ignore-scripts` skips the postinstall codegen, the same as the
      # content sweeps: this job needs the dependencies, not a second pass
      # over 900 lessons.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Not optional: it rewrites an asset URL inside node_modules, and
      # package.json runs it outside the gated half of postinstall.
      - name: Patch almostnode
        run: node scripts/patch-almostnode.mjs

      # Blocks that read a CSV fetch it from the dataslope/datasets repo. The
      # sweeps cache these the same way; without it every regeneration
      # re-downloads the same files.
      - name: Restore dataset cache
        uses: actions/cache@v6
        with:
          path: .dataset-cache
          key: dataset-cache-v1-${{ hashFiles('content/**/*.mdx') }}
          restore-keys: dataset-cache-v1-

      # The C and C++ blocks compile against a 114 MB toolchain the generator
      # downloads from npm on first use. Keyed on the pinned versions inside
      # block-runners.mjs, so a version bump fetches a fresh one.
      - name: Restore C/C++ toolchain
        uses: actions/cache@v6
        with:
          path: .browsercc-cache
          key: browsercc-cache-v1-${{ hashFiles('scripts/lib/block-runners.mjs') }}
          restore-keys: browsercc-cache-v1-

      - name: Regenerate
        run: node scripts/build-block-outputs.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated/block-outputs.json public/block-outputs
          if git diff --cached --quiet; then
            echo "No block output changed."
            exit 0
          fi
          # Say what moved, in the commit itself: a bot commit that only says
          # "update outputs" tells a reader nothing about which lessons now
          # show something different.
          summary=$(git diff --cached --stat | tail -1)
          git commit -m "Regenerate prepopulated block output" \
                     -m "$summary" \
                     -m "Automated by .github/workflows/block-outputs.yml."
          git push
