name: Refresh creation dates

# Keeps `data/created-at.json` (when each chart/illustration entered the
# repo) in step with the files it describes. A file's creation date is its
# add-commit's date, which doesn't exist until the commit does — running here
# dates new art immediately instead of on someone's next local build. The
# snapshot exists (rather than reading git at build time) because Workers
# Builds clones shallow, and a shallow clone reports every file as added at
# its horizon commit; see scripts/build-created-at.mjs.
#
# No loop: triggers on artwork/chart specs, its commit touches only
# data/created-at.json, and GITHUB_TOKEN pushes can't retrigger Actions.
on:
  push:
    paths:
      - "public/images/**"
      - "charts/**"
      - "scripts/build-created-at.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-created-at-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Defensive: never react to our own commit-back, or to the images bot's.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # The whole point: this job's answer *is* the history. A shallow
          # clone here would write the very dates this file exists to prevent.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No dependencies: the script is git plus node built-ins. `npm ci` would
      # be a minute spent on nothing.
      - name: Refresh the creation-date snapshot
        run: node scripts/build-created-at.mjs

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/created-at.json
          if git diff --cached --quiet; then
            echo "Creation dates already up to date, nothing to commit."
            exit 0
          fi
          git commit -m "chore(dates): refresh created-at snapshot [skip ci]"
          branch="${{ github.ref_name }}"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" \
              && git push origin "HEAD:$branch"; then
              echo "Pushed refreshed creation dates."
              exit 0
            fi
            echo "Push attempt $i failed; retrying…"
            sleep "$((2 ** i))"
          done
          echo "::error::Could not push refreshed creation dates after 3 attempts."
          exit 1
