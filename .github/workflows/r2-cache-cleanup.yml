name: R2 incremental-cache cleanup

# Prunes stale OpenNext incremental-cache build folders from the R2 bucket.
#
# Why this exists: the R2 cache keys every object as
# `incremental-cache/<buildId>/<hash>.cache`. Each deploy — production AND every
# Cloudflare preview — writes a fresh ~1–1.4 GB folder under a new build ID
# (one HTML+RSC `.cache` object per prerendered page, ~1,600 of them), and
# OpenNext never deletes old ones. Left alone, the bucket grows by that much
# per deploy forever; at active-development velocity that reached ~34 GB in a
# matter of days.
#
# What it does: always keeps the live production build — a site that sits
# unchanged for months must never lose its cache, which would 500 the home
# page and /courses/* (see open-next.config.ts). Every OTHER build folder is
# deleted once it is either older than THRESHOLD_HOURS or outside the
# MAX_RECENT newest: the age limit retires merged/abandoned previews quickly,
# and the cap bounds the bucket on heavy deploy days.
#
# Safety: the job aborts WITHOUT deleting anything if it cannot positively
# identify the live production build folder, so a transient error can never
# wipe the bucket. Run manually with dry_run=true to preview deletions.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CF_ACCOUNT_ID         Cloudflare account ID (the R2 S3 endpoint host)
#   R2_ACCESS_KEY_ID      R2 API token access key id (Object Read & Write)
#   R2_SECRET_ACCESS_KEY  R2 API token secret access key

on:
  schedule:
    # Every 6 hours, off the top of the hour to avoid scheduler congestion.
    # (GitHub delays scheduled runs by up to a few hours under load; the
    # THRESHOLD_HOURS retention absorbs that jitter.)
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

concurrency:
  group: r2-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      BUCKET: dataslope-inc-cache
      PREFIX: incremental-cache/
      BUILD_ID_URL: https://dataslope.com/api/cache-build-id
      # A non-production build survives only while BOTH hold: younger than
      # THRESHOLD_HOURS and among the MAX_RECENT newest. 24 h keeps a PR's
      # preview URL alive through next-morning review; the cap keeps burst
      # days (10+ deploys) bounded at (MAX_RECENT + 1) build folders total.
      THRESHOLD_HOURS: "24"
      MAX_RECENT: "10"
      # Scheduled runs delete for real; manual runs honor the dry_run input
      # (default true).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Prune stale build folders
        shell: bash
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$ENDPOINT" "$@"; }

          # 1) Ask the live production Worker which build it is serving from.
          prod_id="$(curl -fsS --max-time 30 "$BUILD_ID_URL" || true)"
          prod_id="$(printf '%s' "$prod_id" | tr -d '[:space:]')"
          if [[ ! "$prod_id" =~ ^[A-Za-z0-9_-]{6,}$ ]]; then
            echo "::error::Could not read a valid production build ID from $BUILD_ID_URL (got '${prod_id}'). Aborting without deleting."
            exit 1
          fi
          prod_folder="${PREFIX}${prod_id}/"
          echo "Live production build: $prod_id"

          # 2) Enumerate the build folders in the bucket.
          mapfile -t folders < <(
            aws s3api list-objects-v2 \
              --bucket "$BUCKET" --prefix "$PREFIX" --delimiter "/" \
              --query 'CommonPrefixes[].Prefix' --output text \
              | tr '\t' '\n' | sed '/^$/d' | grep -vx 'None' || true
          )
          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "No build folders under $PREFIX — nothing to do."
            exit 0
          fi

          # 3) Safety: refuse to proceed unless the production folder is present.
          #    (Guards against a prefix/bucket mismatch deleting everything.)
          if ! printf '%s\n' "${folders[@]}" | grep -qxF "$prod_folder"; then
            echo "::error::Production folder '$prod_folder' not found in bucket. Aborting without deleting."
            exit 1
          fi

          cutoff=$(( $(date -u +%s) - THRESHOLD_HOURS * 3600 ))
          echo "Policy: keep live production + up to $MAX_RECENT builds younger than ${THRESHOLD_HOURS}h (cutoff $(date -u -d "@$cutoff" '+%Y-%m-%d %H:%M:%SZ'))"
          echo "Dry run: $DRY_RUN"

          # 4) Timestamp every non-production folder so they can be ranked
          #    newest-first — the MAX_RECENT cap needs a global order, not a
          #    per-folder decision.
          entries=()
          for folder in "${folders[@]}"; do
            [[ "$folder" == "$prod_folder" ]] && continue

            # Newest object in the folder (all written together at deploy time).
            # The CLI auto-paginates above 1000 objects and applies --query to
            # each page separately, so a large build folder returns one max
            # timestamp PER PAGE (multiple lines). Collapse to the overall max —
            # R2 reports LastModified in a uniform UTC ISO-8601 layout, so a
            # lexical sort orders them chronologically — and drop the "None" a
            # genuinely empty page emits, leaving `date` a single value to parse.
            newest="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$folder" \
              --query 'sort_by(Contents, &LastModified)[-1].LastModified' --output text 2>/dev/null \
              | grep -vxF 'None' | sort | tail -n1 || true)"
            if [[ -z "$newest" ]]; then
              echo "skip  $folder (empty)"; continue
            fi
            entries+=("$(printf '%s\t%s\t%s' "$(date -u -d "$newest" +%s)" "$newest" "$folder")")
          done

          echo "KEEP  $prod_folder (live production)"
          kept=1; deleted=0; rank=0
          while IFS=$'\t' read -r ts newest folder; do
            [[ -z "$folder" ]] && continue
            rank=$((rank+1))
            if (( ts >= cutoff && rank <= MAX_RECENT )); then
              echo "KEEP  $folder (last written $newest, ${rank}/${MAX_RECENT} newest)"
              kept=$((kept+1)); continue
            fi
            if (( ts < cutoff )); then
              echo "DELETE $folder (last written $newest, older than ${THRESHOLD_HOURS}h)"
            else
              echo "DELETE $folder (last written $newest, beyond the $MAX_RECENT newest)"
            fi
            if [[ "$DRY_RUN" != "true" ]]; then
              aws s3 rm "s3://${BUCKET}/${folder}" --recursive --only-show-errors
            fi
            deleted=$((deleted+1))
          done < <(printf '%s\n' ${entries[@]+"${entries[@]}"} | sort -rn)

          echo "---"
          # DRY_RUN is always exactly "true" or "false"; choose the verb to match.
          # (A ${DRY_RUN/true/would be } substitution used to leak a literal
          # "false" into the summary on real runs — "folders falsedeleted".)
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Folders kept: $kept | folders would be deleted: $deleted"
          else
            echo "Folders kept: $kept | folders deleted: $deleted"
          fi
