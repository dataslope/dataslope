name: R2 incremental-cache cleanup

# Prunes stale OpenNext incremental-cache build folders from the R2 bucket.
#
# Why this exists: the R2 cache keys every object as
# `incremental-cache/<buildId>/<hash>.cache` (see open-next.config.ts). Each
# deploy, production AND every Cloudflare preview, writes a fresh ~1–1.4 GB
# folder under a new build ID (one HTML+RSC `.cache` object per prerendered
# page, ~1,600 of them), and OpenNext never deletes old ones. Left alone, the
# bucket grows by that much per deploy forever; at active-development velocity
# that reached ~34 GB in a matter of days.
#
# The build ID IS the deployed commit SHA: next.config.ts sets `generateBuildId`
# to WORKERS_CI_COMMIT_SHA on Cloudflare Workers Builds, so a folder name equals
# the commit it was built from. That's what lets this job map each folder to the
# open pull request (branch) it belongs to and keep only the latest commit per
# branch, impossible with Next's default random build IDs.
#
# What it does: always keeps
#   • the live production build (probed from the running Worker), a site that
#     sits unchanged for months must never lose its cache, which would 500 the
#     home page and /courses/* (see open-next.config.ts), AND
#   • any folder written within the last GRACE_HOURS, whatever it matches. A
#     deploy populates its cache folder BEFORE the Worker switches to serving
#     that build, so for some minutes the incoming production folder is
#     protected by neither the probe (which still reports the outgoing build)
#     nor the open-PR rule below (a merge commit's PR closed on merge). A
#     scheduled run that fired inside that window deleted the incoming
#     production cache mid-deploy and 500'd the site (2026-07-16), AND
#   • any folder built from one of the MAIN_COMMITS most recent commits on the
#     default branch. Production builds only ever come from that branch, so
#     this keeps the incoming/just-switched production build even when a
#     deploy stalls past the grace window; the THRESHOLD_HOURS age rule still
#     retires these once they are old enough to be long superseded.
#
# Every OTHER folder is kept only while ALL of these hold:
#   • younger than THRESHOLD_HOURS, AND
#   • its commit is the current head of an OPEN pull request, i.e. the most
#     recent commit on an active branch. Superseded commits (an older head of a
#     still-open PR) and merged/closed PR previews no longer match, so they are
#     pruned, AND
#   • its branch is among the MAX_BRANCHES most-recently-deployed such branches.
#
# Net effect: the live production build, plus at most one preview per active
# branch, capped at MAX_BRANCHES. Merging a PR (or pushing a newer commit to it)
# drops the stale preview folder on the next run. Worst case is
# (MAX_BRANCHES + 1) build folders, plus the transient grace-window and
# recent-main keeps, which the age rule bounds to a THRESHOLD_HOURS-deep tail.
#
# Safety: the job aborts WITHOUT deleting anything if it cannot (a) positively
# identify the live production build folder, (b) list the repo's open pull
# requests, or (c) list the default branch's recent commits, so a transient
# error can never leave every preview "unmatched" and wipe the bucket. Run
# manually with dry_run=true to preview deletions.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID           Cloudflare account ID (the R2 S3 endpoint host)
#   R2_INC_CACHE_ACCESS_KEY_ID      R2 API token access key id (Object Read & Write)
#   R2_INC_CACHE_SECRET_ACCESS_KEY  R2 API token secret access key
#
# The R2_INC_CACHE_* pair is named for the bucket it belongs to. It is an
# Object Read & Write token, deliberately: this job deletes objects on a
# schedule and never needs bucket-level rights. Editing bucket configuration
# needs an Admin Read & Write token, which lives in R2_ADMIN_* and is used only
# by r2-illustrations-lifecycle.yml — admin tokens are account-wide and cannot
# be scoped to one bucket, so keeping one out of this unattended delete job is
# the point of the split. (Renamed 2026-07-30 from R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY, which read as "the" R2 credentials once a second pair
# existed. Unrelated to the identically-named local env vars the illustration
# scripts use, see scripts/lib/r2.mjs.)

on:
  schedule:
    # Every 6 hours, off the top of the hour to avoid scheduler congestion.
    # (GitHub delays scheduled runs by up to a few hours under load; the
    # THRESHOLD_HOURS retention absorbs that jitter.)
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

concurrency:
  group: r2-cache-cleanup
  cancel-in-progress: false

# Least privilege: read-only, and only what `gh pr list` needs.
permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      BUCKET: dataslope-inc-cache
      PREFIX: incremental-cache/
      BUILD_ID_URL: https://dataslope.com/api/cache-build-id
      # A non-production build survives only while ALL hold: younger than
      # THRESHOLD_HOURS, the current head commit of an open PR (the latest
      # commit on an active branch), and among the MAX_BRANCHES most-recently-
      # deployed such branches. 24 h keeps a PR's preview URL alive through
      # next-morning review; MAX_BRANCHES bounds the bucket at
      # (MAX_BRANCHES + 1) build folders total on busy days.
      THRESHOLD_HOURS: "24"
      MAX_BRANCHES: "10"
      # Never delete a folder written within the last GRACE_HOURS, no matter
      # what it matches. A deploy populates its R2 folder minutes before the
      # Worker starts serving that build, so a brand-new folder can belong to
      # an in-flight production deploy that the build-ID probe can't see yet
      # (it still reports the outgoing build) and that no open PR matches (a
      # merge commit's PR closed on merge). 2h comfortably covers populate +
      # switchover, including Workers Builds queueing.
      GRACE_HOURS: "2"
      # Also keep folders built from any of the last MAIN_COMMITS commits on
      # the default branch (production builds only come from there), so a
      # production deploy that stalls past the grace window still can't lose
      # its cache. The THRESHOLD_HOURS age rule retires these eventually.
      MAIN_COMMITS: "30"
      # Scheduled runs delete for real; manual runs honor the dry_run input
      # (default true).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      # For `gh pr list` (see step 2). GITHUB_TOKEN with pull-requests: read.
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_INC_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_INC_CACHE_SECRET_ACCESS_KEY }}
      # Secrets cannot be tested from inside `run:` (an unset one arrives as
      # empty, indistinguishable from a set-but-empty one), so resolve it here.
      CREDS_SET: ${{ secrets.R2_INC_CACHE_ACCESS_KEY_ID != '' && secrets.R2_INC_CACHE_SECRET_ACCESS_KEY != '' }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      # R2 intermittently returns a transient 500 InternalError on DeleteObject.
      # The CLI's default (legacy) retry gives up after ~2 tries; switch to the
      # standard retry mode and raise the attempt count so a burst of transient
      # errors is absorbed inside a single `aws s3 rm` before the per-folder
      # retry loop (see delete_folder) even has to intervene.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
      ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Prune stale build folders
        shell: bash
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$ENDPOINT" "$@"; }

          # 0) An unset CLOUDFLARE_ACCOUNT_ID collapses ENDPOINT to
          #    "https://.r2.cloudflarestorage.com": every aws call then fails,
          #    and the `|| true` on the listing in step 3 turns that into an
          #    empty folder list, i.e. a green run that silently stopped pruning
          #    and lets the bucket grow unbounded. Fail loudly instead. (Worth
          #    guarding because this secret was named CF_ACCOUNT_ID until
          #    Cloudflare deprecated the CF_* prefix, so an older repo may still
          #    hold it under the old name.)
          if [[ "$ENDPOINT" == "https://.r2.cloudflarestorage.com" ]]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set (it was previously named CF_ACCOUNT_ID). Aborting without deleting."
            exit 1
          fi

          # 0b) Missing credentials fail exactly the same silent way, and there
          #     is no malformed ENDPOINT to catch them by: unsigned requests are
          #     rejected, the `|| true` in step 3 swallows it, and the run goes
          #     green having pruned nothing. This is a live risk right now — the
          #     secrets were renamed to R2_INC_CACHE_* on 2026-07-30, and a
          #     scheduled run firing between deleting the old pair and creating
          #     the new one would otherwise report success while the bucket grew.
          if [[ "$CREDS_SET" != "true" ]]; then
            echo "::error::Repository secrets R2_INC_CACHE_ACCESS_KEY_ID and R2_INC_CACHE_SECRET_ACCESS_KEY are not both set (renamed 2026-07-30 from R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY). Aborting without deleting."
            exit 1
          fi

          # Delete a folder, tolerating R2's intermittent 500 InternalError on
          # DeleteObject. `aws s3 rm --recursive` re-lists the folder on every
          # invocation and only deletes what is still present, so repeated
          # attempts converge on an empty folder. Returns non-zero only if the
          # folder still has objects after every attempt (a persistent, not
          # transient, failure), so one flaky delete no longer aborts the run.
          delete_folder() {
            local folder="$1" attempt
            for attempt in 1 2 3 4 5; do
              if aws s3 rm "s3://${BUCKET}/${folder}" --recursive --only-show-errors; then
                return 0
              fi
              echo "  delete attempt ${attempt}/5 for $folder hit transient R2 errors; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            return 1
          }

          # 1) Ask the live production Worker which build it is serving from.
          prod_id="$(curl -fsS --max-time 30 "$BUILD_ID_URL" || true)"
          prod_id="$(printf '%s' "$prod_id" | tr -d '[:space:]')"
          if [[ ! "$prod_id" =~ ^[A-Za-z0-9_-]{6,}$ ]]; then
            echo "::error::Could not read a valid production build ID from $BUILD_ID_URL (got '${prod_id}'). Aborting without deleting."
            exit 1
          fi
          prod_folder="${PREFIX}${prod_id}/"
          echo "Live production build: $prod_id"

          # 2) Map active branches to their latest commit. Each OPEN PR's head
          #    SHA is the most recent commit on that branch; a folder built from
          #    that SHA (build IDs are commit SHAs, see next.config.ts) is the
          #    branch's live preview. Merged/closed PRs drop out of this list, so
          #    their previews are pruned. Abort on API failure, otherwise a
          #    transient error would leave every folder unmatched and delete it.
          if ! pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --json number,headRefName,headRefOid --limit 300)"; then
            echo "::error::Could not list open pull requests from GitHub. Aborting without deleting."
            exit 1
          fi
          declare -A pr_branch   # commit SHA -> "branch (PR #n)", for keep decisions + logging
          while IFS=$'\t' read -r sha branch num; do
            [[ -z "$sha" ]] && continue
            pr_branch["$sha"]="$branch (PR #$num)"
          done < <(printf '%s' "$pr_json" | jq -r '.[] | [.headRefOid, .headRefName, (.number|tostring)] | @tsv')
          # `${#assoc[@]}` on an EMPTY associative array trips `set -u`
          # ("unbound variable"), bash treats a zero-element associative array
          # as unset. Expanding its keys is safe when empty, so count those.
          pr_shas=("${!pr_branch[@]}")
          echo "Open PRs (active branches): ${#pr_shas[@]}"

          # 2b) Recent default-branch commits: production builds come from the
          #     default branch, and between "cache populated" and "Worker
          #     switched" the incoming build is invisible to the probe in
          #     step 1 and matches no open PR (its PR just merged) — the race
          #     that wiped the live cache mid-deploy on 2026-07-16. Protect
          #     these SHAs outright. Abort on API failure for the same reason
          #     as step 2.
          if ! default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" \
             || [[ -z "$default_branch" ]]; then
            echo "::error::Could not resolve the default branch from GitHub. Aborting without deleting."
            exit 1
          fi
          if ! main_shas_raw="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=${default_branch}&per_page=${MAIN_COMMITS}" \
                --jq '.[].sha')"; then
            echo "::error::Could not list recent '$default_branch' commits from GitHub. Aborting without deleting."
            exit 1
          fi
          declare -A main_sha   # commit SHA -> 1, recent default-branch commits
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            main_sha["$sha"]=1
          done <<< "$main_shas_raw"
          # Same empty-associative-array/`set -u` dance as pr_branch above.
          main_keys=("${!main_sha[@]}")
          echo "Recent '$default_branch' commits protected: ${#main_keys[@]}"

          # 3) Enumerate the build folders in the bucket.
          mapfile -t folders < <(
            aws s3api list-objects-v2 \
              --bucket "$BUCKET" --prefix "$PREFIX" --delimiter "/" \
              --query 'CommonPrefixes[].Prefix' --output text \
              | tr '\t' '\n' | sed '/^$/d' | grep -vx 'None' || true
          )
          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "No build folders under $PREFIX, nothing to do."
            exit 0
          fi

          # 4) Safety: refuse to proceed unless the production folder is present.
          #    (Guards against a prefix/bucket mismatch deleting everything.)
          if ! printf '%s\n' "${folders[@]}" | grep -qxF "$prod_folder"; then
            echo "::error::Production folder '$prod_folder' not found in bucket. Aborting without deleting."
            exit 1
          fi

          now=$(date -u +%s)
          cutoff=$(( now - THRESHOLD_HOURS * 3600 ))
          grace_cutoff=$(( now - GRACE_HOURS * 3600 ))
          echo "Policy: keep live production + anything written in the last ${GRACE_HOURS}h + recent '$default_branch' builds + the latest commit of up to $MAX_BRANCHES open-PR branches, each younger than ${THRESHOLD_HOURS}h (cutoff $(date -u -d "@$cutoff" '+%Y-%m-%d %H:%M:%SZ'))"
          echo "Dry run: $DRY_RUN"

          # 5) Timestamp every non-production folder so active-branch previews
          #    can be ranked newest-first, the MAX_BRANCHES cap needs a global
          #    order, not a per-folder decision.
          entries=()
          for folder in "${folders[@]}"; do
            [[ "$folder" == "$prod_folder" ]] && continue

            # Newest object in the folder (all written together at deploy time).
            # The CLI auto-paginates above 1000 objects and applies --query to
            # each page separately, so a large build folder returns one max
            # timestamp PER PAGE (multiple lines). Collapse to the overall max,
            # R2 reports LastModified in a uniform UTC ISO-8601 layout, so a
            # lexical sort orders them chronologically, and drop the "None" a
            # genuinely empty page emits, leaving `date` a single value to parse.
            newest="$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$folder" \
              --query 'sort_by(Contents, &LastModified)[-1].LastModified' --output text 2>/dev/null \
              | grep -vxF 'None' | sort | tail -n1 || true)"
            if [[ -z "$newest" ]]; then
              echo "skip  $folder (empty)"; continue
            fi
            entries+=("$(printf '%s\t%s\t%s' "$(date -u -d "$newest" +%s)" "$newest" "$folder")")
          done

          echo "KEEP  $prod_folder (live production)"
          kept=1; deleted=0; failed=0; branches=0
          while IFS=$'\t' read -r ts newest folder; do
            [[ -z "$folder" ]] && continue
            # Folder name is the commit SHA: strip the prefix and trailing slash.
            sha="${folder#"$PREFIX"}"; sha="${sha%/}"

            # Order matters: the grace window shields everything first (a
            # freshly written folder may be an in-flight deploy that nothing
            # else matches), then age retires old folders (the 24h floor
            # applies even to an open PR's head), then the default-branch and
            # per-branch keeps, then the cap.
            if (( ts >= grace_cutoff )); then
              echo "KEEP  $folder (last written $newest, inside the ${GRACE_HOURS}h grace window, possibly an in-flight deploy)"
              kept=$((kept+1)); continue
            elif (( ts < cutoff )); then
              echo "DELETE $folder (last written $newest, older than ${THRESHOLD_HOURS}h)"
            elif [[ -n "${main_sha[$sha]+set}" ]]; then
              echo "KEEP  $folder (recent '$default_branch' commit, current or recent production build)"
              kept=$((kept+1)); continue
            elif [[ -n "${pr_branch[$sha]+set}" ]]; then
              branches=$((branches+1))
              if (( branches <= MAX_BRANCHES )); then
                echo "KEEP  $folder (${pr_branch[$sha]}, latest commit, branch ${branches}/${MAX_BRANCHES})"
                kept=$((kept+1)); continue
              fi
              echo "DELETE $folder (${pr_branch[$sha]}, beyond the $MAX_BRANCHES most recent branches)"
            else
              echo "DELETE $folder (last written $newest, not the head of any open PR, merged, closed, or superseded)"
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              deleted=$((deleted+1))
            elif delete_folder "$folder"; then
              deleted=$((deleted+1))
            else
              # Persistent (non-transient) failure: log it, keep sweeping the
              # rest, and fail the job at the end so it's surfaced. The next
              # scheduled run retries this folder from scratch.
              echo "::error::Could not fully delete $folder after 5 attempts (persistent R2 errors)."
              failed=$((failed+1))
            fi
          done < <(printf '%s\n' ${entries[@]+"${entries[@]}"} | sort -rn)

          echo "---"
          # DRY_RUN is always exactly "true" or "false"; choose the verb to match.
          # (A ${DRY_RUN/true/would be } substitution used to leak a literal
          # "false" into the summary on real runs, "folders falsedeleted".)
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Folders kept: $kept | folders would be deleted: $deleted"
          else
            echo "Folders kept: $kept | folders deleted: $deleted | folders failed: $failed"
          fi

          # Surface persistent delete failures loudly, but only after every
          # folder has been attempted, a later run will retry the stragglers.
          if (( failed > 0 )); then
            echo "::error::${failed} folder(s) could not be fully deleted after retries; the next scheduled run will retry them."
            exit 1
          fi
