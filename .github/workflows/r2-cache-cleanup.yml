name: R2 incremental-cache cleanup

# Prunes stale OpenNext incremental-cache build folders from the R2 bucket.
# Every deploy (production AND every preview) writes a fresh folder under
# `incremental-cache/<buildId>/` and OpenNext never deletes old ones — left
# alone the bucket grows unbounded (once reached ~78 GB in days).
#
# Two numbers set the bucket size, and this job only owns one of them:
#
#   bucket ≈ (folders retained, THIS JOB) × (bytes per build, THE BUILD PATH)
#
# Per-build bytes are ~2.34 GiB of raw JSON, or ~0.147 GiB once
# scripts/compress-cache.mjs has run — and that script runs from the
# Cloudflare *build command*, dashboard config outside this repo. So a bucket
# that looks like a retention failure may be neither: step 7 samples each
# folder's first four bytes for the brotli magic and says which it is, because
# the read path accepts both formats and an uncompressed deploy is otherwise
# completely silent.
#
# It was silent for eleven days. On 2026-08-26 production measured 0.16 GB and
# every one of the six preview folders 2.52 GB, with the build command
# carrying `&& node scripts/compress-cache.mjs` the whole time — so the
# compression is being UNDONE on the preview path, not skipped. `deploy` and
# `upload` both populate from `.open-next/cache` byte-for-byte and neither
# rebuilds, while `opennextjs-cloudflare build` wipes that directory
# (`initOutputDir`) and regenerates it raw. A second build after the build
# command — a non-production branch deploy command that starts with one — is
# the shape that produces exactly this split. The half of the deploy path
# nobody reads the size of was the whole 15 GB.
#
# The build ID IS the deployed commit SHA (next.config.ts generateBuildId =
# WORKERS_CI_COMMIT_SHA on Workers Builds); that equality is what lets this
# job reason about folders at all.
#
# Policy — ask each deployment what it serves now and what it's about to serve:
#
#   KEEP = { probe(production) }                  what prod serves now
#        ∪ { probe(preview_b) ∀ ACTIVE branch b } what each preview serves now
#        ∪ { head(default_branch) }               what prod is about to serve
#        ∪ { head(b) ∀ ACTIVE branch b }          what each preview is about to serve
#        ∪ { folders populated < GRACE_HOURS }    catch-all for the unclassifiable
#   DELETE everything else
#
# "probe" = GET /api/cache-build-id on the deployment, which reports the
# running Worker's OPEN_NEXT_BUILD_ID — the exact R2 folder name, so it can't
# drift from reality. Branches are probed at their preview ALIAS (the stable
# per-branch hostname).
#
# BRANCHES, not open PRs: Workers Builds builds every branch on every push,
# PR or not, so a PR-shaped keep set under-covers pre-PR branches.
#
# ACTIVE branches, though: Workers Builds does NOT tear a preview down when a
# PR merges — the alias answers as long as the branch exists, so an
# unconditioned branch keep set pins a build per merged-but-undeleted branch
# indefinitely. A branch is RETIRED, and claims nothing, when all three hold:
#
#   • at least one pull request has this branch as its head,
#   • none of them is open, and
#   • the branch head is still the head of one of those closed pull requests.
#
# The third clause is what makes it safe to act the moment a PR closes: a
# head that has moved PAST its closed PR is unreviewed work Workers Builds
# has already deployed — the preview is live again (a reopened PR, follow-up
# commits, a reused branch). Retirement only ever WITHHOLDS a claim, never
# revokes one: production and the default branch head are registered before
# any branch is considered, so a retired branch sharing a SHA with either
# keeps it. A branch that never had a PR is NOT retired — there is no end
# signal to read — so it is named in the log and holds its folders until the
# branch itself is deleted.
#
# The alias is DERIVED from the branch name, never read out of a check run:
# check runs hang off a COMMIT, and a commit reachable from two branches
# carries whichever branch's build ran, so reading it can protect the wrong
# branch. The cost of deriving it is long branch names: past 63 characters
# Cloudflare truncates and appends a hash it does not publish the recipe for
# (changelog 2025-08-14), so those branches have a working preview this job
# cannot name and each falls back to pinning FALLBACK_COMMITS folders. That is
# the safe direction, and it is not free — keep branch names short, or the
# fallback is what sets the bucket size.
#
# Nothing is retained on age alone: the bucket holds live + incoming
# production, at most two folders per active branch, plus the GRACE_HOURS
# window — the count of branches with unfinished work sets the bucket size.
#
# Deliberate consequence: a merged PR's preview breaks. Once its cache is
# pruned the alias 500s, and the Cloudflare check-run link on the merged PR
# still points at it — the alternative is paying a whole build a branch to
# keep previews of merged code loadable. GitHub's "Automatically delete head
# branches" avoids the broken link and retires the branch in the same stroke.
#
# Deliberate consequence: NO rollback cover. Rolling the Worker back to a
# pruned build 500s the site (the `node:fs` mechanism in open-next.config.ts),
# and Cloudflare's Deployments tab offers those targets with no warning;
# revert-and-redeploy (~12 min) is the intended recovery. If rollback cover is
# ever wanted, add it as an explicit count-bounded rule ("keep last N
# production builds"), not by lengthening a time window.
#
# Safety (two outages came from deleting a folder a deployment was serving:
# 2026-07-16 production, 2026-08-05 preview):
#   • Abort WITHOUT deleting if the live production build, default branch +
#     head, or branch list can't be positively identified — a transient error
#     must never leave every folder unexplained and therefore deleted.
#   • Abort if the live production folder isn't in the bucket at all (catches
#     a prefix/bucket mismatch before it deletes everything).
#   • A PREVIEW probe failure never aborts the sweep and never widens into a
#     delete: that branch alone falls back to keeping its last
#     FALLBACK_COMMITS commits. "No answer" is never "nothing to keep".
#   • A pull-request lookup failure resolves the same way: an unanswered
#     question leaves that branch ACTIVE, i.e. protected. Retirement is the
#     one rule whose job is to delete more, so it must never fire on a guess.
#   • Branch names are attacker-controllable and become fetched URLs: the slug
#     rule folds everything outside [a-z0-9-] to '-', and the result is
#     checked against PREVIEW_URL_RE before any request.
#   • GRACE_HOURS is a safety net, not policy: a minutes-old folder may belong
#     to an in-flight deploy no probe sees yet and no branch head names.
#
# Run manually with dry_run=true to preview deletions.
#
# Required repository secrets:
#   CLOUDFLARE_ACCOUNT_ID           Cloudflare account ID (the R2 S3 endpoint host)
#   R2_INC_CACHE_ACCESS_KEY_ID      R2 API token access key id (Object Read & Write)
#   R2_INC_CACHE_SECRET_ACCESS_KEY  R2 API token secret access key
#
# The R2_INC_CACHE_* pair is Object Read & Write on purpose: this unattended
# delete job never needs bucket-level rights. Admin tokens (R2_ADMIN_*, used
# only by r2-illustrations-lifecycle.yml) are account-wide and can't be scoped
# to one bucket — keeping one out of this job is the point of the split.

on:
  schedule:
    # Every 2 hours, off the top of the hour to avoid scheduler congestion.
    # Cheap: ListObjectsV2 is Class A ($4.50/million — not Class B); ~10 LISTs
    # quiet, ~100 full sweep, ~5,000/month against R2's 1M free Class A ops.
    # Plus one ranged GET per folder for the format sample — Class B, ~3,000 a
    # month against 10M free.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

concurrency:
  group: r2-cache-cleanup
  cancel-in-progress: false

# Least privilege, read-only: `contents` covers branches/commits/default
# branch; `pull-requests` read covers the retirement check — this job never
# writes to a PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      BUCKET: dataslope-inc-cache
      PREFIX: incremental-cache/
      BUILD_ID_URL: https://dataslope.com/api/cache-build-id
      # Never delete a folder populated within the last GRACE_HOURS: a deploy
      # populates R2 minutes before the Worker switches over, so a brand-new
      # folder can belong to an in-flight deploy no probe sees yet and no
      # branch head names (a merge commit's build ID is the merge SHA). 2h
      # comfortably covers populate + switchover including build queueing.
      GRACE_HOURS: "2"
      # Sanity cap, not policy: bounds how many branches get probed and how
      # many folders may be kept SOLELY on a branch-head claim
      # (newest-populated-first). A folder a live probe named is NEVER capped —
      # deleting one is an outage. Retired branches are skipped before either
      # bound applies, so the cap counts branches with live work. If it fires,
      # the honest fix is deleting stale branches, not raising the number.
      MAX_BRANCHES: "10"
      # Degraded mode only: when a branch's preview can't be probed, that
      # branch keeps its most recent commits instead, so an alive-but-
      # unreachable preview cannot lose its cache. Keeping a SHA with no
      # folder costs nothing.
      FALLBACK_COMMITS: "3"
      # Preview alias = https://<branch-slug>-<worker>.<subdomain>. The worker
      # name must match wrangler.jsonc's "name".
      PREVIEW_WORKER: dataslope
      PREVIEW_SUBDOMAIN: subwaymatch.workers.dev
      # Belt and braces around the URL this job builds then fetches; only
      # fires on a bug in the slug rule — exactly when no request must be made.
      PREVIEW_URL_RE: '^https://[a-z0-9-]+-dataslope\.subwaymatch\.workers\.dev$'
      # The whole keep set rests on single HTTP GETs, so retry before
      # believing a negative answer.
      PROBE_ATTEMPTS: "3"
      # Scheduled runs delete for real; manual runs honor dry_run (default true).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      # For the `gh api` calls below.
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_INC_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_INC_CACHE_SECRET_ACCESS_KEY }}
      # Secrets can't be tested from inside `run:` (unset arrives as empty),
      # so resolve it here.
      CREDS_SET: ${{ secrets.R2_INC_CACHE_ACCESS_KEY_ID != '' && secrets.R2_INC_CACHE_SECRET_ACCESS_KEY != '' }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      # R2 intermittently 500s on DeleteObject and the CLI's legacy retry
      # gives up after ~2 tries; standard mode + more attempts absorbs bursts
      # inside a single `aws s3 rm` before delete_folder's loop intervenes.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"
      ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Prune stale build folders
        shell: bash
        run: |
          set -euo pipefail
          aws() { command aws --endpoint-url "$ENDPOINT" "$@"; }

          # 0) An unset CLOUDFLARE_ACCOUNT_ID collapses ENDPOINT; every aws
          #    call fails, and step 5's `|| true` turns that into an empty
          #    folder list — a green run that silently stopped pruning. Fail
          #    loudly instead.
          if [[ "$ENDPOINT" == "https://.r2.cloudflarestorage.com" ]]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set (it was previously named CF_ACCOUNT_ID). Aborting without deleting."
            exit 1
          fi

          # 0b) Missing credentials fail the same silent way, with no
          #     malformed ENDPOINT to catch them by: unsigned requests are
          #     rejected, step 5's `|| true` swallows it, the run goes green
          #     having pruned nothing.
          if [[ "$CREDS_SET" != "true" ]]; then
            echo "::error::Repository secrets R2_INC_CACHE_ACCESS_KEY_ID and R2_INC_CACHE_SECRET_ACCESS_KEY are not both set (renamed 2026-07-30 from R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY). Aborting without deleting."
            exit 1
          fi

          # Total bytes under a prefix. The CLI auto-paginates and applies
          # --query per page, so each page emits one tab-separated batch (the
          # same shape step 6's LastModified query relies on); flatten and
          # sum. LISTs are Class A ops, so only the whole prefix and folders
          # on their way out are weighed. Missing/empty prefix yields 0.
          bucket_bytes() {
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$1" \
              --query 'Contents[].Size' --output text 2>/dev/null \
              | tr '\t' '\n' | sed '/^$/d' | grep -vxF 'None' \
              | awk '{ s += $1 } END { printf "%d", s + 0 }'
          }

          # GB is decimal, matching the R2 dashboard; awk because bash has no
          # floating point.
          gb() { awk -v b="${1:-0}" 'BEGIN { printf "%.2f", b / 1e9 }'; }
          pct() { awk -v a="${1:-0}" -v b="${2:-0}" 'BEGIN { printf "%.0f", (b > 0 ? a * 100 / b : 0) }'; }

          # Everything this job needs to know about one folder, in ONE list:
          # the bytes it occupies, the timestamps that place it in time, and a
          # key to sample. Rows are "<size>\t<LastModified>\t<key>" — a nested
          # --query projection prints one object per line, unlike the flat
          # `Contents[].Size` above, so there is no page batch to flatten. Same
          # Class A cost as listing the timestamps alone, which is what this
          # replaced; the sizes and the sample key now ride along for free.
          folder_rows() {
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$1" \
              --query 'Contents[].[Size,LastModified,Key]' --output text 2>/dev/null \
              | grep -vx 'None' || true
          }

          # Is this build's cache brotli-framed, or the raw JSON that predates
          # scripts/compress-cache.mjs? Reads the first four bytes of ONE entry
          # and looks for the magic in lib/cache/brotliCacheFormat.ts. One
          # sample settles the whole folder: a build's entries are written by a
          # single populate, so the format is a property of the BUILD, not of
          # the object. A ranged GET is a Class B op (~8 a run). This only ever
          # reports — the reader accepts both formats, which is exactly why an
          # uncompressed deploy is otherwise invisible.
          cache_format() {
            local key="$1" tmp magic
            if [[ -z "$key" ]]; then printf 'unknown'; return 0; fi
            tmp="$(mktemp)"
            if ! aws s3api get-object --bucket "$BUCKET" --key "$key" \
                 --range 'bytes=0-3' "$tmp" >/dev/null 2>&1; then
              rm -f "$tmp"; printf 'unknown'; return 0
            fi
            magic="$(od -An -tx1 -N4 "$tmp" | tr -d ' \n')"
            rm -f "$tmp"
            # 00 42 52 31 is `\0BR1`, BROTLI_CACHE_MAGIC.
            if [[ "$magic" == "00425231" ]]; then printf 'brotli'; else printf 'raw'; fi
          }

          # How a folder reads in the log: "2.52 GB, UNCOMPRESSED". The size is
          # on every line, not just on folders being deleted, so a run answers
          # "why is the bucket this big" without a second look at the bucket.
          folder_note() {
            local folder="$1" note
            note="$(gb "${folder_bytes[$folder]:-0}") GB"
            case "${folder_format[$folder]:-unknown}" in
              raw) note="$note, UNCOMPRESSED" ;;
              brotli) note="$note, brotli" ;;
            esac
            # Populated-at on every line too: whether a build compressed is a
            # question about WHEN it ran as much as which path ran it, and the
            # two are only separable with both on the same line.
            printf '%s' "$note, populated ${folder_date[$folder]:-unknown}"
          }

          # Tolerates R2's transient DeleteObject 500s: `s3 rm` re-lists each
          # attempt, so retries converge. Non-zero only on persistent failure.
          delete_folder() {
            local folder="$1" attempt
            for attempt in 1 2 3 4 5; do
              if aws s3 rm "s3://${BUCKET}/${folder}" --recursive --only-show-errors; then
                return 0
              fi
              echo "  delete attempt ${attempt}/5 for $folder hit transient R2 errors; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            return 1
          }

          # Ask a running Worker which build it serves (OPEN_NEXT_BUILD_ID
          # verbatim, byte-identical to the R2 folder name). Validate the
          # shape: an edge HTML error page treated as a build ID would match
          # no folder and protect nothing. Three outcomes, because "no answer"
          # and "no such deployment" call for opposite responses:
          #   0 + build ID   the deployment answered
          #   2              edge 404: no deployment at this alias — caller
          #                  must NOT fall back
          #   1              no usable answer after PROBE_ATTEMPTS — caller
          #                  must assume the worst and be generous
          probe_build_id() {
            local url="$1" attempt out code body
            for (( attempt = 1; attempt <= PROBE_ATTEMPTS; attempt++ )); do
              out="$(curl -sS --max-time 30 -w $'\n%{http_code}' "$url" 2>/dev/null || true)"
              code="${out##*$'\n'}"
              body="$(printf '%s' "${out%$'\n'*}" | tr -d '[:space:]')"
              if [[ "$code" == "200" && "$body" =~ ^[A-Za-z0-9_-]{6,}$ ]]; then
                printf '%s' "$body"
                return 0
              fi
              # 404 = hostname resolves to no deployment; definitive, so
              # don't retry.
              if [[ "$code" == "404" ]]; then
                return 2
              fi
              if (( attempt < PROBE_ATTEMPTS )); then
                sleep $(( attempt * 3 ))
              fi
            done
            return 1
          }

          # A branch's stable preview alias (not the per-commit Preview URL):
          # branch name with everything outside [a-z0-9-] folded to '-',
          # joined to the worker name. DNS labels cap at 63 chars and
          # Cloudflare truncates to fit; rather than guess where, an over-long
          # name yields no alias and falls back — the failure mode is
          # "protect more than necessary", never "probe the wrong host".
          preview_alias() {
            local branch="$1" slug label url
            slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')"
            label="${slug}-${PREVIEW_WORKER}"
            if (( ${#label} > 63 )); then
              return 1
            fi
            url="https://${label}.${PREVIEW_SUBDOMAIN}"
            if [[ ! "$url" =~ $PREVIEW_URL_RE ]]; then
              return 1
            fi
            printf '%s' "$url"
          }

          # Is this branch's work finished? Prints "<status>\t<detail>":
          #   retired  every PR for this branch merged/closed and the head has
          #            not moved since — it claims no folder at all
          #   active   an open PR, commits after the last one closed, or the
          #            lookup failed
          #   none     no PR ever had this branch as head; treated as active
          #            and named in the log
          # (See the header for why head-has-not-moved makes retirement safe.)
          # One request per branch, filtered by head. `head` wants
          # `<owner>:<branch>`, so a fork's branch can't match — correct, a
          # fork branch has no preview here.
          branch_pr_status() {
            local branch="$1" head_sha="$2" prs number state sha merged_at
            local open="" closed="" seen=0
            if ! prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls" -X GET \
                  -f state=all -f per_page=100 \
                  -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" \
                  --jq '.[] | [.number, .state, .head.sha, (.merged_at // "")] | @tsv')"; then
              # Never retire a branch on a GitHub hiccup: the whole point of
              # this rule is to delete more, so a failed lookup has to leave
              # the preview protected rather than unprotected.
              echo "::warning::Could not read pull requests for '$branch'; treating it as active." >&2
              printf 'active\tpull request lookup failed, so the branch is assumed to be in use\n'
              return 0
            fi
            while IFS=$'\t' read -r number state sha merged_at; do
              [[ -z "$number" ]] && continue
              seen=$((seen+1))
              if [[ "$state" == "open" ]]; then
                open="${open:+$open, }#$number"
              elif [[ "$sha" == "$head_sha" ]]; then
                closed="#$number $([[ -n "$merged_at" ]] && echo merged || echo closed)"
              fi
            done <<< "$prs"
            if [[ -n "$open" ]]; then
              printf 'active\topen pull request %s\n' "$open"
            elif [[ -n "$closed" ]]; then
              printf 'retired\t%s, and its head has not moved since\n' "$closed"
            elif (( seen > 0 )); then
              printf 'active\tits pull requests are all closed, but commits landed after the last one\n'
            else
              printf 'none\tno pull request has ever had this branch as its head\n'
            fi
          }

          # The keep set: build ID -> why. `keep_class` separates "a
          # deployment is serving this now" (never capped) from "a branch head
          # names this" (capped by MAX_BRANCHES).
          declare -A keep_reason keep_class
          remember() {
            local sha="$1" class="$2" reason="$3"
            if [[ -z "$sha" ]]; then return 0; fi
            # First claim wins, with one exception: a live probe upgrades a
            # branch-head claim. The branch loop registers the head BEFORE
            # probing, and a healthy preview serves exactly that head — kept
            # first-come, the folder would stay class 'branch' and the
            # MAX_BRANCHES cap could delete what that preview is serving.
            if [[ -n "${keep_reason[$sha]+set}" ]]; then
              if [[ "$class" == "live" && "${keep_class[$sha]}" == "branch" ]]; then
                keep_reason["$sha"]="$reason"
                keep_class["$sha"]="live"
              fi
              return 0
            fi
            keep_reason["$sha"]="$reason"
            keep_class["$sha"]="$class"
          }

          # 1) What production serves RIGHT NOW. Exhausting retries aborts:
          #    without this answer every folder is unexplained, and the sweep
          #    would delete the live cache and 500 the site.
          if ! prod_id="$(probe_build_id "$BUILD_ID_URL")"; then
            echo "::error::Could not read a valid production build ID from $BUILD_ID_URL after $PROBE_ATTEMPTS attempts. Aborting without deleting."
            exit 1
          fi
          prod_folder="${PREFIX}${prod_id}/"
          remember "$prod_id" live "live production, probed at $BUILD_ID_URL"

          # 2) What production is ABOUT TO serve: head(default_branch). During
          #    the minutes between "cache populated" and "Worker switched" the
          #    probe still reports the outgoing build — that gap wiped the
          #    live cache mid-deploy on 2026-07-16. Unbounded in time, so a
          #    stalled deploy cannot age out.
          if ! default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" \
             || [[ -z "$default_branch" ]]; then
            echo "::error::Could not resolve the default branch from GitHub. Aborting without deleting."
            exit 1
          fi
          if ! default_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq .sha)" \
             || [[ -z "$default_head" ]]; then
            echo "::error::Could not resolve the head of '$default_branch' from GitHub. Aborting without deleting."
            exit 1
          fi
          remember "$default_head" next "head of '$default_branch', production's incoming build"

          # 3) Enumerate branches (not PRs — see header). Abort on API
          #    failure: a transient error would leave every preview folder
          #    unexplained, i.e. deleted.
          if ! branches_raw="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate \
                --jq '.[] | [.name, .commit.sha] | @tsv')"; then
            echo "::error::Could not list branches from GitHub. Aborting without deleting."
            exit 1
          fi
          branch_total=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            branch_total=$((branch_total+1))
          done <<< "$branches_raw"
          echo "Branches: $branch_total"

          # 4) Per branch, register the head commit (about to serve) and the
          #    probe (serving now). Usually the same folder, occasionally not:
          #    a push moves the head while the preview keeps serving the
          #    previous commit — deleting that older folder 500'd a live
          #    preview on 2026-08-05.
          probed=0; retired=0
          while IFS=$'\t' read -r branch head_sha; do
            [[ -z "$branch" ]] && continue

            # The default branch has no preview (it deploys to PRODUCTION,
            # already probed in step 1). Probing it would fail into the
            # fallback below and needlessly pin its last FALLBACK_COMMITS.
            if [[ "$branch" == "$default_branch" ]]; then
              # Also claimed here: a push landing between step 2's read and
              # this one makes this the newer answer.
              remember "$head_sha" next "head of '$default_branch', production's incoming build"
              continue
            fi

            # Retirement is decided BEFORE any claim is registered: a retired
            # branch's head is as dead as the build its preview still serves.
            pr_status=""; pr_detail=""
            IFS=$'\t' read -r pr_status pr_detail < <(branch_pr_status "$branch" "$head_sha")
            if [[ "$pr_status" == "retired" ]]; then
              echo "Retired '$branch' ($pr_detail); it claims no build folder."
              retired=$((retired+1))
              continue
            fi
            if [[ "$pr_status" == "none" ]]; then
              # Named explicitly: nothing can ever retire this branch shape —
              # only deleting the branch releases its folders.
              echo "Branch '$branch' has no pull request ($pr_detail); treated as work in progress."
            fi

            remember "$head_sha" branch "head of '$branch', that preview's incoming build"

            if (( probed >= MAX_BRANCHES )); then
              echo "::warning::More than $MAX_BRANCHES branches exist; '$branch' was not probed and is protected only by its head commit. Delete merged branches, or raise MAX_BRANCHES."
              continue
            fi
            probed=$((probed+1))

            served=""; rc=1
            if alias_url="$(preview_alias "$branch")"; then
              served="$(probe_build_id "${alias_url}/api/cache-build-id")" || rc=$?
              if [[ -n "$served" ]]; then rc=0; fi
            else
              alias_url=""
              echo "Branch name '$branch' does not yield a preview alias that fits a DNS label; keeping its last $FALLBACK_COMMITS commits instead."
            fi

            if (( rc == 0 )); then
              # A healthy preview serves its own branch head, so this usually
              # re-claims the SHA registered above — remember() upgrades it to
              # class 'live', lifting it out of the MAX_BRANCHES cap.
              echo "Preview '$branch' is serving ${served:0:12} (probed at $alias_url)"
              remember "$served" live "serving the '$branch' preview, probed at $alias_url"
              continue
            fi

            # Definitive 404: no deployment at all, nothing live to protect —
            # the head-commit claim above is the whole truth, no fallback.
            if (( rc == 2 )); then
              echo "No deployment at $alias_url for '$branch' (404); its head build is the only claim it has."
              continue
            fi

            # rc == 1: no answer. A probe failure must never widen into a
            # delete — fall back for THIS BRANCH ONLY, never abort the sweep.
            # But losing the probe AND the commit list means knowing nothing
            # about the branch, so abort rather than guess.
            if ! recent="$(gh api "repos/$GITHUB_REPOSITORY/commits" -X GET \
                  -f sha="$branch" -f per_page="$FALLBACK_COMMITS" --jq '.[].sha')"; then
              echo "::error::Could not probe the '$branch' preview and could not list its recent commits either. Aborting without deleting."
              exit 1
            fi
            echo "::warning::The '$branch' preview did not answer at ${alias_url:-<no alias>}; keeping its last $FALLBACK_COMMITS commits instead."
            while IFS= read -r c; do
              [[ -z "$c" ]] && continue
              remember "$c" live "recent commit of '$branch', kept because that preview could not be probed"
            done <<< "$recent"
          done <<< "$branches_raw"

          echo "Branches: $branch_total total | $retired retired | $probed previews probed"
          echo "Keep set (${#keep_reason[@]} build IDs):"
          for sha in "${!keep_reason[@]}"; do
            echo "  ${sha:0:12}  ${keep_reason[$sha]}"
          done

          # 5) Enumerate the build folders in the bucket.
          mapfile -t folders < <(
            aws s3api list-objects-v2 \
              --bucket "$BUCKET" --prefix "$PREFIX" --delimiter "/" \
              --query 'CommonPrefixes[].Prefix' --output text \
              | tr '\t' '\n' | sed '/^$/d' | grep -vx 'None' || true
          )
          if [[ ${#folders[@]} -eq 0 ]]; then
            echo "No build folders under $PREFIX, nothing to do."
            exit 0
          fi

          # Measured over the whole prefix, not summed per folder, so objects
          # outside any build folder are counted too.
          bytes_before="$(bucket_bytes "$PREFIX")"
          echo "Bucket before: $(gb "$bytes_before") GB across ${#folders[@]} build folders"

          # Safety: refuse to proceed unless the production folder is present.
          # (Guards against a prefix/bucket mismatch deleting everything.)
          if ! printf '%s\n' "${folders[@]}" | grep -qxF "$prod_folder"; then
            echo "::error::Production folder '$prod_folder' not found in bucket. Aborting without deleting."
            exit 1
          fi

          now=$(date -u +%s)
          grace_cutoff=$(( now - GRACE_HOURS * 3600 ))
          echo "Policy: keep what production and every ACTIVE branch's preview are serving or about to serve, plus anything populated in the last ${GRACE_HOURS}h (since $(date -u -d "@$grace_cutoff" '+%Y-%m-%d %H:%M:%SZ')). A branch whose pull request has merged or closed, with no commits since, keeps nothing."
          echo "Dry run: $DRY_RUN"

          # 6) Weigh, date and sample every folder in one pass.
          #
          #    Size and format are collected for ALL of them, production
          #    included, because they are what the run log needs to explain
          #    the bucket. Dates are only collected for the rest: production
          #    is kept unconditionally, so nothing reads its age.
          declare -A folder_bytes folder_format folder_date folder_gone
          entries=()
          for folder in "${folders[@]}"; do
            rows="$(folder_rows "$folder")"
            if [[ -z "$rows" ]]; then
              folder_bytes["$folder"]=0; folder_format["$folder"]=unknown
              echo "skip  $folder (empty)"; continue
            fi
            folder_bytes["$folder"]="$(
              printf '%s\n' "$rows" | awk -F'\t' '{ s += $1 } END { printf "%d", s + 0 }'
            )"
            first_row="${rows%%$'\n'*}"
            folder_format["$folder"]="$(cache_format "$(printf '%s' "$first_row" | cut -f3)")"

            # MEDIAN LastModified, not the newest: objects can also arrive at
            # REQUEST time long after the deploy (cached 404s once reset a
            # folder's apparent age for hours, holding it inside GRACE_HOURS).
            # The median is immune by construction — a ~1,081-object burst
            # can't be moved by a few late writes — and stays seconds-old
            # during an in-flight populate, which is what the grace window
            # protects. Sort lexically, which R2's uniform UTC ISO-8601 makes
            # chronological.
            mapfile -t stamps < <(printf '%s\n' "$rows" | cut -f2 | sort)
            populated="${stamps[$(( ${#stamps[@]} / 2 ))]}"
            folder_date["$folder"]="$populated"

            # Production is kept unconditionally, so nothing reads its age and
            # it is not a candidate in the ordering below. Its date is still
            # collected above, because the log prints one for every folder:
            # "which builds compress" is a question about a timeline.
            [[ "$folder" == "$prod_folder" ]] && continue

            entries+=("$(printf '%s\t%s\t%s' "$(date -u -d "$populated" +%s)" "$populated" "$folder")")
          done

          echo "KEEP  $prod_folder (${keep_reason[$prod_id]}) — $(folder_note "$prod_folder")"
          kept=1; deleted=0; failed=0; branches=0; freed=0
          while IFS=$'\t' read -r ts populated folder; do
            [[ -z "$folder" ]] && continue
            # Folder name is the commit SHA: strip the prefix and trailing slash.
            sha="${folder#"$PREFIX"}"; sha="${sha%/}"

            if [[ -n "${keep_reason[$sha]+set}" ]]; then
              # Branch-head claims are capped; live-probe claims are not:
              # over the cap the first costs a preview its next build, the
              # second takes down a deployment serving right now.
              if [[ "${keep_class[$sha]}" == "branch" ]]; then
                branches=$((branches+1))
                if (( branches > MAX_BRANCHES )); then
                  # Over the cap the folder loses its branch claim, but the
                  # grace window still applies — the header's KEEP formula
                  # promises it unconditionally, and a just-populated folder
                  # may be an in-flight deploy for that very preview.
                  if (( ts >= grace_cutoff )); then
                    echo "KEEP  $folder (${keep_reason[$sha]}, beyond the branch cap but populated $populated, inside the ${GRACE_HOURS}h grace window) — $(folder_note "$folder")"
                    kept=$((kept+1)); continue
                  fi
                  echo "DELETE $folder (${keep_reason[$sha]}, beyond the $MAX_BRANCHES most recently populated branch builds) — $(folder_note "$folder")"
                else
                  echo "KEEP  $folder (${keep_reason[$sha]}, branch ${branches}/${MAX_BRANCHES}) — $(folder_note "$folder")"
                  kept=$((kept+1)); continue
                fi
              else
                echo "KEEP  $folder (${keep_reason[$sha]}) — $(folder_note "$folder")"
                kept=$((kept+1)); continue
              fi
            elif (( ts >= grace_cutoff )); then
              # Deliberately blind: a just-populated deploy may be visible to
              # neither a probe nor a branch head yet.
              echo "KEEP  $folder (populated $populated, inside the ${GRACE_HOURS}h grace window, possibly an in-flight deploy) — $(folder_note "$folder")"
              kept=$((kept+1)); continue
            else
              # "No active branch", not "nothing is serving it": a retired
              # branch's preview may still be answering from this folder, and
              # taking it down is the intended outcome.
              echo "DELETE $folder (populated $populated, claimed by no live deployment and no active branch) — $(folder_note "$folder")"
            fi

            # Weighed in step 6, before anything was removed — afterwards
            # there would be nothing left to measure.
            folder_size="${folder_bytes[$folder]:-0}"

            if [[ "$DRY_RUN" == "true" ]]; then
              deleted=$((deleted+1)); freed=$((freed + folder_size)); folder_gone["$folder"]=1
            elif delete_folder "$folder"; then
              deleted=$((deleted+1)); freed=$((freed + folder_size)); folder_gone["$folder"]=1
            else
              # Persistent failure: keep sweeping the rest, fail the job at
              # the end; the next run retries this folder.
              echo "::error::Could not fully delete $folder after 5 attempts (persistent R2 errors)."
              failed=$((failed+1))
            fi
          done < <(printf '%s\n' ${entries[@]+"${entries[@]}"} | sort -rn)

          echo "---"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Folders kept: $kept | folders would be deleted: $deleted"
            # Nothing was removed, so the closing size is arithmetic, and says so.
            echo "Bucket: $(gb "$bytes_before") GB now -> $(gb "$((bytes_before - freed))") GB projected | would free $(gb "$freed") GB ($(pct "$freed" "$bytes_before")%)"
          else
            echo "Folders kept: $kept | folders deleted: $deleted | folders failed: $failed"
            # Re-measure rather than subtract: stays honest when a delete
            # failed or a deploy wrote a new folder mid-sweep.
            bytes_after="$(bucket_bytes "$PREFIX")"
            echo "Bucket: $(gb "$bytes_before") GB before -> $(gb "$bytes_after") GB after | freed $(gb "$((bytes_before - bytes_after))") GB ($(pct "$((bytes_before - bytes_after))" "$bytes_before")%)"
          fi

          # 7) What the retained bytes are made of. Retention is only one of
          #    the two numbers that set the bucket size; the other is bytes
          #    per build, and that one is decided OUTSIDE this repo.
          #
          #    scripts/compress-cache.mjs runs from the Cloudflare *build
          #    command*, which Workers Builds runs for production and
          #    non-production branches alike — so "is it set" is not the only
          #    question to ask of it. On 2026-08-26 it WAS set and production
          #    measured 0.16 GB while all six preview folders measured
          #    2.52 GB: 12.6 GB of the bucket, compressed at build time and
          #    then thrown away before the preview populate. `deploy` and
          #    `upload` both stream `.open-next/cache` byte-for-byte and
          #    neither rebuilds; `opennextjs-cloudflare build` wipes that
          #    directory and regenerates it raw. So a second build on one path
          #    only — a non-production branch deploy command beginning with
          #    one — undoes it for previews and leaves production correct.
          #
          #    Which is why the report is per folder and the warning fires on
          #    ANY raw build, not just production's: production is the build
          #    that stays correct under this failure, i.e. the one that hides
          #    it. The populated-at stamp on each line separates "this path
          #    never compresses" from "this build predates the fix".
          remaining=0; raw_folders=0; raw_bytes=0
          for folder in "${folders[@]}"; do
            [[ -n "${folder_gone[$folder]+set}" ]] && continue
            remaining=$((remaining+1))
            [[ "${folder_format[$folder]:-}" == "raw" ]] || continue
            raw_folders=$((raw_folders+1)); raw_bytes=$((raw_bytes + ${folder_bytes[$folder]:-0}))
          done
          if (( raw_folders > 0 )); then
            echo "::warning::${raw_folders} of ${remaining} retained build folders carry raw JSON, not the brotli scripts/compress-cache.mjs produces: $(gb "$raw_bytes") GB where it would leave about $(gb "$((raw_bytes / 16))") GB. $([[ "${folder_format[$prod_folder]:-}" == "raw" ]] && echo "Production is one of them, so start with the build command: Workers -> dataslope -> Settings -> Build -> Build command = 'npx opennextjs-cloudflare build && node scripts/compress-cache.mjs'." || echo "Production is NOT one of them, so the build command is running compress-cache and something on the preview path is undoing it: check the non-production branch deploy command for a second 'opennextjs-cloudflare build', which wipes and regenerates the cache the build command just compressed.") See DEVELOPMENT.md, 'Cloudflare Workers Builds configuration'."
          fi

          # Surface persistent delete failures, but only after every folder
          # was attempted.
          if (( failed > 0 )); then
            echo "::error::${failed} folder(s) could not be fully deleted after retries; the next scheduled run will retry them."
            exit 1
          fi
