name: Checks

# Typecheck, lint and unit tests, on every pull request and every push to main.
#
# The only other automated gate is the Cloudflare deploy: Next 16 runs no
# ESLint during `next build` (the integration is gone), and the deploy's own
# typecheck covers only the app graph and reports last. `tsc --noEmit` here
# covers everything tsconfig includes (scripts/, e2e/, __tests__/) and runs in
# parallel with the deploy.
#
# Prerequisite for a faster deploy: once this job is REQUIRED in branch
# protection, `typescript: { ignoreBuildErrors: true }` in next.config.ts
# becomes a defensible ~29s off every build. Do not make that change earlier —
# a type error would reach `main` with a green deploy and nothing to say so.
#
# One job, not three: three parallel jobs would each re-pay ~77s of checkout +
# setup + install to overlap ~72s of checks. The trade flips once any single
# check costs more than the install. The whole job finishes well inside the
# Cloudflare build beside it, so it never gates a merge in practice.
#
# Steps run under `if: ${{ !cancelled() }}` so a failing typecheck does not
# hide a failing test (`!cancelled()` rather than `always()`, so superseded
# runs still cancel).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref; there is nothing here worth
  # finishing once a newer commit exists.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    # Install ~3m plus ~2.5m of checks locally; a 2-core runner is slower.
    # This is a ceiling for a hung run, not a target.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # postinstall runs the generator chain here (it only skips itself on
      # Workers Builds, where `npm run build` re-runs it anyway), so
      # lib/generated/* exists before anything below reads it. A checkout
      # without it does not typecheck: those modules are gitignored and only
      # their .d.ts siblings are committed.
      - run: npm ci

      # tsconfig.json includes `.next/types/**/*.ts`, which `next build` would
      # normally emit. `next typegen` produces exactly those route/page types
      # without paying for a build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # Errors fail the job; the ~156 pre-existing warnings do not. Adding
      # `--max-warnings 0` is the natural next step once that backlog is
      # cleared — until then it would make this job permanently red and
      # therefore ignored.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
