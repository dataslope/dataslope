name: Optimize images

# Regenerates optimized public/images/* + manifest when a raster source (or
# the optimizer) changes, and commits the result back — only sources are ever
# committed by hand. Cloudflare builds run `build:images` themselves, so the
# site is correct before this commit lands; the commit-back is bookkeeping
# plus the incremental win (future deploys skip re-encoding, see
# scripts/build-images.mjs) and is marked `[skip ci]`.
#
# No loop: triggers only on assets/images/** + the optimizer, while the
# commit touches only public/images/** + the manifest (and GITHUB_TOKEN
# pushes can't retrigger Actions anyway).
#
# Runs on every branch including main. Caveat: if main gains push protection,
# a stale-outputs push to main fails this job's push step — regenerate
# locally or via workflow_dispatch instead.
on:
  push:
    paths:
      - "assets/images/**"
      - "scripts/build-images.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    # Defensive: never react to our own commit-back.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Locked install keeps the encoder identical to local/deploy runs, so
      # the committed bytes match; `--ignore-scripts` skips postinstall codegen.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate optimized images
        run: node scripts/build-images.mjs

      - name: Commit optimized images if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images lib/generated/images.js
          if git diff --cached --quiet; then
            echo "Optimized images already up to date, nothing to commit."
            exit 0
          fi
          git commit -m "chore(images): regenerate optimized assets [skip ci]"
          branch="${{ github.ref_name }}"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" \
              && git push origin "HEAD:$branch"; then
              echo "Pushed optimized images."
              exit 0
            fi
            echo "Push attempt $i failed; retrying…"
            sleep "$((2 ** i))"
          done
          echo "::error::Could not push optimized images after 3 attempts."
          exit 1
